// ─── FIT TEXT LINES ──────────────────────────────────────────────────────────
function fitTextLines(text, widthIn, fontSize, maxLines = 2) {
  if (text == null) text = "";
  const CHAR_WIDTH_RATIO = 0.58;
  const floor = Math.min(6, fontSize);
  let size = fontSize;
  let charsPerLine = (widthIn * 72) / (size * CHAR_WIDTH_RATIO);
  let lines = Math.max(1, Math.ceil(text.length / charsPerLine));
  let attempts = 0;
  const maxAttempts = Math.ceil(fontSize - floor) + 2;
  while (lines > maxLines && size > floor && attempts < maxAttempts) {
    size = Math.max(floor, size - 1);
    charsPerLine = (widthIn * 72) / (size * CHAR_WIDTH_RATIO);
    lines = Math.max(1, Math.ceil(text.length / charsPerLine));
    attempts++;
  }
  return { fontSize: size, lines };
}

// ─── DERIVE GRID ─────────────────────────────────────────────────────────────
function deriveGrid(opts = {}) {
  const bodySize     = opts.bodySize     ?? 11;
  const leadingRatio = opts.leadingRatio ?? 1.4;
  const ML           = opts.marginL      ?? 0.40;
  const MR           = opts.marginR      ?? 0.40;
  const columns      = opts.columns      ?? "asym32";
  const footerH      = opts.footerH      ?? 0.28;
  const hasNotes     = opts.hasNotes     ?? false;
  const SW           = opts.slideW       ?? 10;
  const SH           = opts.slideH       ?? 5.625;
  const MODULE       = (bodySize * leadingRatio) / 72;
  const GUTTER       = MODULE * 2;
  const WORK_W       = SW - ML - MR;
  let cols;
  if (columns === "sym2") {
    const colW = (WORK_W - GUTTER) / 2;
    cols = { L:{x:ML,w:colW}, R:{x:ML+colW+GUTTER,w:colW} };
  } else if (columns === "asym32") {
    const unit = (WORK_W - GUTTER) / 5;
    cols = { L:{x:ML,w:unit*3}, R:{x:ML+unit*3+GUTTER,w:unit*2} };
  } else {
    cols = { L:{x:ML,w:WORK_W}, R:null };
  }
  const FOOTER_Y   = SH - footerH;
  const GAP_FN     = MODULE * 1.5;
  let NOTES_Y = null, NOTES_H = null, contBottom;
  if (hasNotes) {
    NOTES_H = 0.24;
    NOTES_Y = FOOTER_Y - GAP_FN - NOTES_H;
    contBottom = NOTES_Y - MODULE;
  } else {
    contBottom = FOOTER_Y - GAP_FN;
  }
  const contTop = 0.16;
  return {
    slideW:SW, slideH:SH,
    margins:{L:ML,R:MR},
    module:MODULE, gutter:GUTTER, workW:WORK_W,
    cols,
    zones:{
      contentTop:contTop, contentBottom:contBottom,
      footerH, footerY:FOOTER_Y,
      notesY:NOTES_Y, notesH:NOTES_H, hasNotes,
    },
  };
}

// ─── DERIVE HEADER BLOCK ─────────────────────────────────────────────────────
function deriveHeaderBlock(grid, titleText, opts = {}) {
  const M = grid.module;
  if (typeof titleText !== "string") titleText = String(titleText || "");
  const requestedSize = opts.titleSize ?? 22;
  const titleWidthIn = grid.workW * 0.72;
  const { fontSize:titleSize, lines:titleLines } = fitTextLines(titleText, titleWidthIn, requestedSize, 2);
  const lineHeightIn = (titleSize / 72) * 1.25;
  const ruleY   = grid.zones.contentTop;
  const ruleH   = 0.018;
  const titleY  = ruleY + ruleH + M * 0.4;
  const titleH  = lineHeightIn * titleLines + 0.05;
  const subY    = titleY + titleH + M * 0.15;
  const subH    = M * 0.9;
  const blocksY = subY + subH + M * (opts.gapAfterSubtitle ?? 0.9);
  return { ruleY, ruleH, titleY, titleH, subY, subH, blocksY, titleSize, titleLines };
}

// ─── ADD HEADER ──────────────────────────────────────────────────────────────
function addHeader(slide, pres, grid, head, { title, subtitle, showLogo = true }) {
  slide.addShape(pres.shapes.RECTANGLE, {
    x:grid.cols.L.x, y:head.ruleY, w:0.38, h:head.ruleH,
    fill:{color:C.gold}, line:{color:C.gold},
  });
  slide.addText(title, {
    x:grid.cols.L.x, y:head.titleY, w:grid.workW * 0.72, h:head.titleH,
    fontSize:head.titleSize, color:C.navy, fontFace:F.serif,
    valign:"top", margin:0, wrap:true,
  });
  if (subtitle) {
    slide.addText(subtitle, {
      x:grid.cols.L.x, y:head.subY, w:grid.cols.L.w, h:head.subH,
      fontSize:10, color:C.gold, fontFace:F.sans, valign:"top", margin:0,
    });
  }
  if (showLogo) {
    const logoH = 0.5;
    slide.addImage({
      data: LOGO_B64,
      x: grid.slideW - grid.margins.R - logoH,
      y: head.titleY + (head.titleH - logoH) / 2,
      w: logoH, h: logoH,
    });
  }
}

// ─── ADD FOOTER ──────────────────────────────────────────────────────────────
function addFooter(slide, pres, grid, { left, center, right }) {
  const { footerY, footerH } = grid.zones;
  slide.addShape(pres.shapes.RECTANGLE, {
    x:0, y:footerY, w:grid.slideW, h:footerH,
    fill:{color:C.navy}, line:{color:C.navy},
  });
  const seg1W = grid.slideW * 0.35;
  const seg2X = grid.margins.L + seg1W;
  const seg2W = grid.slideW * 0.30;
  const seg3X = seg2X + seg2W;
  const seg3W = grid.slideW - grid.margins.R - seg3X;
  slide.addText(left,   { x:grid.margins.L, y:footerY, w:seg1W, h:footerH, fontSize:5.5, bold:true,  color:C.white, fontFace:F.sans, charSpacing:0.8, valign:"middle", margin:0 });
  slide.addText(center, { x:seg2X,          y:footerY, w:seg2W, h:footerH, fontSize:5.5, bold:false, color:C.white, fontFace:F.sans, charSpacing:0.5, valign:"middle", align:"center", margin:0 });
  slide.addText(right,  { x:seg3X,          y:footerY, w:seg3W, h:footerH, fontSize:5.5, bold:true,  color:C.white, fontFace:F.sans, charSpacing:0.8, valign:"middle", align:"right", margin:0 });
}

// ─── ADD NOTES ───────────────────────────────────────────────────────────────
function addNotes(slide, grid, notesArray) {
  if (!grid.zones.hasNotes || !notesArray || !notesArray.length) return;
  slide.addText(notesArray.join("\n"), {
    x:grid.margins.L, y:grid.zones.notesY, w:grid.workW * 0.75, h:grid.zones.notesH,
    fontSize:5.5, color:C.muted, fontFace:F.sans, valign:"top", margin:0, lineSpacingMultiple:1.2,
  });
}

// ─── TBL CELL ────────────────────────────────────────────────────────────────
function tblCell(text, opts = {}) {
  return {
    text,
    options: {
      fontSize:  opts.fs    ?? 6.5,
      bold:      opts.bold  ?? false,
      underline: opts.ul    ? { style:"sng" } : undefined,
      color:     opts.color ?? C.text,
      fontFace:  F.sans,
      align:     opts.align ?? "left",
      valign:    "middle",
      fill:      opts.fill  ? { color:opts.fill } : undefined,
      margin:    [2,5,2,5],
    }
  };
}

// ─── ADD CARD ────────────────────────────────────────────────────────────────
function addCard(slide, pres, card) {
  const { x, y, w, h, color, title, body } = card;
  const requestedTitleSize = card.titleSize ?? 11;
  let bodySize = card.bodySize ?? 7.5;
  const M = card.module ?? ((11 * 1.4) / 72);
  slide.addShape(pres.shapes.RECTANGLE, { x,y,w,h, fill:{color}, line:{color} });
  const titlePadX    = 0.1;
  const titleWidthIn = w - titlePadX * 2;
  const { fontSize:titleSize, lines:titleLines } = fitTextLines(title, titleWidthIn, requestedTitleSize, 2);
  const titleTopOffset = M * 0.6;
  const titleLineH     = (titleSize / 72) * 1.3;
  const titleH         = titleLineH * titleLines + M * 0.2;
  slide.addText(title, {
    x:x+titlePadX, y:y+titleTopOffset, w:titleWidthIn, h:titleH,
    fontSize:titleSize, bold:true, italic:true, color:C.white,
    fontFace:F.sans, align:"center", valign:"top", margin:0,
  });
  const bodyTopOffset = titleTopOffset + titleH + M * 0.3;
  const bodyPadX      = 0.12;
  const bodyWidthIn   = w - bodyPadX * 2;
  const bodyAvailH    = Math.max(0.1, h - bodyTopOffset - 0.15);
  let bodyLineH      = (bodySize / 72) * 1.3;
  let charsPerLine   = (bodyWidthIn * 72) / (bodySize * 0.52);
  let bodyLines      = Math.max(1, Math.ceil((body || "").length / charsPerLine));
  let neededH        = bodyLineH * bodyLines;
  let att = 0;
  while (neededH > bodyAvailH && bodySize > 5.5 && att < 6) {
    const shrink = Math.max(0.85, bodyAvailH / neededH);
    bodySize = Math.max(5.5, bodySize * shrink);
    bodyLineH = (bodySize / 72) * 1.3;
    charsPerLine = (bodyWidthIn * 72) / (bodySize * 0.52);
    bodyLines = Math.max(1, Math.ceil((body || "").length / charsPerLine));
    neededH = bodyLineH * bodyLines;
    att++;
  }
  slide.addText(body || "", {
    x:x+bodyPadX, y:y+bodyTopOffset, w:bodyWidthIn, h:bodyAvailH,
    fontSize:bodySize, color:C.white, fontFace:F.sans,
    valign:"top", margin:0, lineSpacingMultiple:1.3,
  });
}

// ─── LAYOUT FLOWCHART ────────────────────────────────────────────────────────
function layoutFlowchart(stepsInput, availableH, boxW, opts = {}) {
  let labelSize = opts.labelSize ?? 8.5;
  let bodySize  = opts.bodySize  ?? 7;
  const arrowH  = opts.arrowH   ?? ((11 * 1.4) / 72) * 0.75;
  const padX = 0.15, textW = boxW - padX * 2;
  const vPad = 0.08, gapLabelBody = 0.06, minBoxH = 0.35;
  function computeH(lSize, bSize) {
    const llH = (lSize / 72) * 1.25, blH = (bSize / 72) * 1.25;
    return stepsInput.map(s => {
      const { lines:ll } = fitTextLines(s.label, textW, lSize, 2);
      const cpl = (textW * 72) / (bSize * 0.52);
      const bl  = Math.max(1, Math.ceil((s.body || "").length / cpl));
      return Math.max(vPad*2 + llH*ll + gapLabelBody + blH*bl, minBoxH);
    });
  }
  let heights = computeH(labelSize, bodySize);
  let total   = heights.reduce((a,b)=>a+b,0) + (stepsInput.length-1)*arrowH;
  let att = 0;
  while (total > availableH && att < 10 && labelSize > 6 && bodySize > 5.5) {
    const f = Math.max(0.85, availableH / total);
    labelSize = Math.max(6, labelSize * f);
    bodySize  = Math.max(5.5, bodySize * f);
    heights   = computeH(labelSize, bodySize);
    total     = heights.reduce((a,b)=>a+b,0) + (stepsInput.length-1)*arrowH;
    att++;
  }
  return {
    steps: stepsInput.map((s,i) => ({...s, h:heights[i]})),
    labelSize, bodySize, arrowH,
    overflow: total > availableH, overflowAmount: Math.max(0, total - availableH),
  };
}

// ─── ADD FLOW STEP ───────────────────────────────────────────────────────────
function addFlowStep(slide, pres, opts) {
  const { x, y, w, h, label, body, isEdge, drawArrowBelow, arrowH, labelSize, bodySize } = opts;
  const padX = 0.15, vPad = 0.08;
  slide.addShape(pres.shapes.RECTANGLE, {
    x,y,w,h,
    fill:{color: isEdge ? C.navy : C.white},
    line:{color:C.navy, pt: isEdge ? 0 : 0.8},
  });
  slide.addText([
    { text:label+"\n", options:{bold:true, fontSize:labelSize, breakLine:true} },
    { text:body||"",   options:{fontSize:bodySize, bold:false} },
  ], {
    x:x+padX, y:y+vPad*0.5, w:w-padX*2, h:h-vPad,
    color: isEdge ? C.white : C.navy, fontFace:F.sans,
    align:"center", valign:"middle", margin:0, lineSpacingMultiple:1.15,
  });
  if (drawArrowBelow) {
    const ax = x + w/2;
    slide.addShape(pres.shapes.LINE, {
      x:ax, y:y+h, w:0, h:arrowH*0.7, line:{color:C.navy, pt:1.5},
    });
    slide.addText("▼", {
      x:ax-0.12, y:y+h+arrowH*0.6, w:0.24, h:arrowH*0.4,
      fontSize:8, color:C.navy, fontFace:F.sans,
      align:"center", valign:"top", margin:0,
    });
  }
}

// ─── BUILD COVER ─────────────────────────────────────────────────────────────
function buildCover(slide, pres, s) {
  const SW=10, SH=5.625, ML=0.40, MR=0.40;
  const HEADER_H=0.30, IMG_Y=0.30, IMG_H=3.05;
  const RULE_Y=IMG_Y+IMG_H, RULE_H=0.025;
  const WHITE_Y=RULE_Y+RULE_H, FOOTER_H=0.30, FOOTER_Y=SH-FOOTER_H;
  const WHITE_H=FOOTER_Y-WHITE_Y;
  slide.background = { color:C.white };
  // header navy
  slide.addShape(pres.shapes.RECTANGLE, { x:0,y:0,w:SW,h:HEADER_H, fill:{color:C.navy},line:{color:C.navy} });
  slide.addText("CONFIDENCIAL  ·  USO EXCLUSIVO DEL DESTINATARIO", {
    x:ML,y:0,w:5.5,h:HEADER_H, fontSize:7,bold:true,color:C.white,fontFace:F.sans,
    charSpacing:1.2,valign:"middle",margin:0,
  });
  slide.addText("PREPARADO PARA   " + (s.client||"").toUpperCase(), {
    x:SW-MR-3.5,y:0,w:3.5,h:HEADER_H, fontSize:7,bold:true,color:C.white,fontFace:F.sans,
    charSpacing:1.2,valign:"middle",align:"right",margin:0,
  });
  // hero placeholder
  slide.addShape(pres.shapes.RECTANGLE, { x:0,y:IMG_Y,w:SW,h:IMG_H, fill:{color:C.navy},line:{color:C.navy} });
  slide.addText("[ reemplazar con imagen del sector en PowerPoint ]", {
    x:0,y:IMG_Y,w:SW,h:IMG_H, fontSize:9,italic:true,color:C.goldLight,fontFace:F.sans,
    align:"center",valign:"middle",margin:0,
  });
  // línea dorada
  slide.addShape(pres.shapes.RECTANGLE, { x:0,y:RULE_Y,w:SW,h:RULE_H, fill:{color:C.gold},line:{color:C.gold} });
  // zona blanca: supratítulo + título + subtítulo + logo
  const M = (11*1.4)/72;
  const supraY = WHITE_Y + WHITE_H*0.12;
  slide.addText((s.company||"").toUpperCase(), {
    x:ML,y:supraY,w:SW*0.6,h:M*1.0, fontSize:9,bold:true,color:C.gold,fontFace:F.sans,
    charSpacing:1.2,valign:"top",margin:0,
  });
  const titleY = supraY + M*1.3;
  const { fontSize:tfs, lines:tl } = fitTextLines(s.title||"", SW*0.62, 24, 2);
  const titleH = (tfs/72)*1.25*tl + 0.08;
  slide.addShape(pres.shapes.RECTANGLE, { x:ML,y:titleY,w:0.045,h:titleH*0.92, fill:{color:C.gold},line:{color:C.gold} });
  slide.addText(s.title||"", {
    x:ML+0.18,y:titleY,w:SW*0.62,h:titleH, fontSize:tfs,bold:true,color:C.navy,fontFace:F.sans,
    valign:"top",margin:0,
  });
  const subY = titleY + titleH + M*0.5;
  slide.addText(s.subtitle||"", {
    x:ML+0.18,y:subY,w:SW*0.55,h:M*1.2, fontSize:10.5,italic:true,color:"4A5568",fontFace:F.sans,
    valign:"top",margin:0,
  });
  const logoH = WHITE_H*0.62;
  slide.addImage({ data:LOGO_B64, x:SW-MR-logoH-0.1, y:WHITE_Y+(WHITE_H-logoH)/2, w:logoH,h:logoH });
  // footer
  slide.addShape(pres.shapes.RECTANGLE, { x:0,y:FOOTER_Y,w:SW,h:0.012, fill:{color:C.goldLight},line:{color:C.goldLight} });
  slide.addText(
    [(s.month||"").toUpperCase(),"ESTRICTAMENTE PRIVADO Y CONFIDENCIAL",(s.city||"").toUpperCase(),(s.country||"").toUpperCase()].join("  ·  "),
    { x:0,y:FOOTER_Y+0.02,w:SW,h:FOOTER_H-0.02, fontSize:7,bold:true,color:C.gold,fontFace:F.sans,
      charSpacing:1,align:"center",valign:"middle",margin:0 }
  );
}

// ─── INFER PROJECT NAME ──────────────────────────────────────────────────────
function inferProjectName(title) {
  if (!title) return "PROYECTO";
  const m = title.match(/(?:del?|para|de)\s+([A-ZÁÉÍÓÚÑ][\wÁÉÍÓÚÑáéíóúñ\s]+)$/);
  if (m) return m[1].trim().toUpperCase();
  return title.split(/\s+/).slice(-2).join(" ").toUpperCase();
}

// ─── PRESENTATION DATA ───────────────────────────────────────────────────────
// Claude reemplaza el objeto de abajo con los datos reales de la presentación.
// Ver SKILL.md para el schema completo de cada tipo de slide.
const PRESENTATION_DATA = __PLACEHOLDER_DATA__;

// ─── MAIN ────────────────────────────────────────────────────────────────────
(function initUI() {
  const d = PRESENTATION_DATA;
  const contentSlides = (d.slides || []).filter(s => s.type !== "cover");
  const cover = (d.slides || []).find(s => s.type === "cover");
  document.getElementById("ui-title").textContent    = cover ? cover.title : (d.projectName || "Presentación");
  document.getElementById("ui-subtitle").textContent = cover ? cover.subtitle : "Grid Müller-Brockmann · Identidad CV";
  document.getElementById("ui-slides").textContent   = `${(d.slides||[]).length} slides · ${contentSlides.length} de contenido`;
})();

async function generarPPTX() {
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  btn.textContent = "Generando…"; btn.disabled = true; err.style.display = "none";
  try {
    const pres = new PptxGenJS();
    pres.layout = "LAYOUT_16x9";
    const d = PRESENTATION_DATA;
    const projectName = d.projectName || inferProjectName((d.slides||[]).find(s=>s.type!=="cover")?.title || "");
    const totalContent = (d.slides||[]).filter(s=>s.type!=="cover").length;
    let contentIdx = 0;

    for (const sData of (d.slides || [])) {
      const slide = pres.addSlide();
      slide.background = { color: C.white };

      if (sData.type === "cover") {
        buildCover(slide, pres, sData);
        continue;
      }
      contentIdx++;

      const grid = deriveGrid({
        columns:  sData.columns  || "asym32",
        hasNotes: !!(sData.notes && sData.notes.length),
      });
      const head = deriveHeaderBlock(grid, sData.title || "", {
        titleSize:        sData.titleSize        || 22,
        gapAfterSubtitle: sData.gapAfterSubtitle || 0.9,
      });
      addHeader(slide, pres, grid, head, {
        title:    sData.title    || "",
        subtitle: sData.subtitle || null,
        showLogo: true,
      });

      // ── tarjetas ──────────────────────────────────────────────────────────
      if (sData.type === "cards" && sData.cards && sData.cards.length) {
        const cards = sData.cards;
        const n     = cards.length;
        const gap   = 0.18;
        const cardW = (grid.workW - gap * (n - 1)) / n;
        const cardH = grid.zones.contentBottom - head.blocksY - 0.08;
        cards.forEach((card, i) => {
          addCard(slide, pres, {
            x: grid.cols.L.x + i * (cardW + gap),
            y: head.blocksY,
            w: cardW, h: cardH,
            color:  card.color || C.navy,
            title:  card.title || "",
            body:   card.body  || "",
            module: grid.module,
          });
        });

      // ── flowchart ─────────────────────────────────────────────────────────
      } else if (sData.type === "flowchart" && sData.steps && sData.steps.length) {
        const availH = grid.zones.contentBottom - head.blocksY;
        const boxW   = grid.workW * 0.55;
        const layout = layoutFlowchart(sData.steps, availH, boxW);
        const bx     = grid.cols.L.x + (grid.workW - boxW) / 2;
        let cy = head.blocksY;
        layout.steps.forEach((step, i) => {
          const isLast = i === layout.steps.length - 1;
          addFlowStep(slide, pres, {
            x:bx, y:cy, w:boxW, h:step.h,
            label:step.label||"", body:step.body||"",
            isEdge: i === 0 || isLast,
            drawArrowBelow: !isLast,
            arrowH: layout.arrowH,
            labelSize: layout.labelSize,
            bodySize:  layout.bodySize,
          });
          cy += step.h + (isLast ? 0 : layout.arrowH);
        });

      // ── texto + tabla (default) ───────────────────────────────────────────
      } else {
        const lx = grid.cols.L.x, lw = grid.cols.L.w;
        const hasTable = sData.table && grid.cols.R;
        if (sData.text) {
          slide.addText(sData.text, {
            x:lx, y:head.blocksY,
            w: hasTable ? lw : grid.workW,
            h: grid.zones.contentBottom - head.blocksY,
            fontSize:10, color:C.text, fontFace:F.sans,
            valign:"top", margin:0, lineSpacingMultiple:1.3,
          });
        }
        if (hasTable) {
          const { headers, rows } = sData.table;
          const rx   = grid.cols.R.x, rw = grid.cols.R.w;
          const nCol = headers.length;
          const colW = headers.map((_,j) => j===0 ? rw*0.45 : rw*(0.55/(nCol-1)));
          const rowH = 0.215;
          slide.addTable(
            [
              headers.map(h => tblCell(h, {fs:8,bold:true,color:C.white,fill:C.tblHeader,align:"center"})),
              ...(rows||[]).map((row,ri) =>
                row.map((cell,ci) => tblCell(cell, {
                  fs:8, color:C.text,
                  fill: ri%2===0 ? C.tblAlt : C.white,
                  align: ci===0 ? "left" : "right",
                }))
              ),
            ],
            { x:rx, y:head.blocksY, w:rw, rowH, border:{pt:0.3,color:C.tblBorder}, colW }
          );
        }
      }

      if (sData.notes && sData.notes.length) addNotes(slide, grid, sData.notes);

      const footerRight = sData.footerRight || `${projectName}  ·  ${contentIdx}/${totalContent}`;
      addFooter(slide, pres, grid, {
        left:   d.footerLeft   || "ESTRICTAMENTE PRIVADO Y CONFIDENCIAL",
        center: d.footerCenter || projectName,
        right:  footerRight,
      });
    }

    const filename = (projectName || "presentacion").toLowerCase().replace(/\s+/g,"_") + ".pptx";
    await pres.writeFile({ fileName: filename });
    btn.textContent = "⬇ Descargar PPTX"; btn.disabled = false;
  } catch (e) {
    err.textContent = "Error: " + e.message; err.style.display = "block";
    btn.textContent = "⬇ Descargar PPTX"; btn.disabled = false;
    console.error(e);
  }
}
